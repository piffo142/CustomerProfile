    <path d="M 250 74 C 180 84 152 138 160 186 C 162 202 152 214 147 226 C 144 232 149 237 156 238 C 161 239 163 244 162 250 C 161 256 164 260 170 261 C 175 262 177 267 175 274 C 172 282 178 288 188 289 C 199 290 208 296 210 306 C 214 320 208 336 194 350" />
